name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarball to npm (requires trusted publishing)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF !== `refs/tags/v${version}`) {
            throw new Error("Run Release on a stable vX.Y.Z tag matching package.json");
          }
          NODE
      - run: npm ci
      - name: Pack once for all tests and publication
        run: |
          mkdir release
          npm pack --pack-destination release
          mv release/willtsai-skillpacker-*.tgz release/willtsai-skillpacker.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/willtsai-skillpacker.tgz
          if-no-files-found: error
  verify:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.19.0, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:package
        env:
          SKILLPACKER_TARBALL: release/willtsai-skillpacker.tgz
  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - run: npm --version
      - run: npm publish release/willtsai-skillpacker.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org
